function table(id,rows,kind){if(!rows.length)return '<div class="empty">표시할 항목이 없습니다.</div>';const body=rows.map((r,i)=>{const key=`${id}-${i}`;if(kind==='portfolio'||kind==='changes'){return `<tr class="${kind==='changes'?'changed':''}"><td>${esc(r.name)}<br><span class="muted">${esc(r.code)}</span></td><td>${esc(r.market||'-')}</td><td>${weight(r.actual_weight)}</td><td>${weight(r.target_weight)}</td><td>${esc(r.source_label||'메르 논지 기반 AI 추론')}</td><td>${esc(r.display_today_action||r.today_action||'유지')}</td><td>${esc(r.return_label||'집계 전')}</td><td><button onclick="toggle('${key}')">상세</button></td></tr><tr id="${key}" class="detail"><td colspan="8">${holdingDetail(r)}</td></tr>`}if(kind==='watchlist'){return `<tr><td>${esc(r.name)}</td><td>${esc(r.status||'관심종목')}</td><td>${esc(r.latest_material_signal_date||'-')}</td><td><button onclick="toggle('${key}')">상세</button></td></tr><tr id="${key}" class="detail"><td colspan="4">${holdingDetail(r)}</td></tr>`}return `<tr><td>${esc(r.name)}</td><td>${esc(r.closed_date||'-')}</td><td>${esc(r.close_reason||'과거 편출 종목')}</td><td><button onclick="toggle('${key}')">상세</button></td></tr><tr id="${key}" class="detail"><td colspan="4">${holdingDetail(r)}</td></tr>`}).join('');const head=kind==='watchlist'?'<th>종목</th><th>상태</th><th>최근 확인</th><th>상세</th>':kind==='closed'?'<th>종목</th><th>편출일</th><th>사유</th><th>상세</th>':'<th>종목</th><th>시장</th><th>실제비중</th><th>목표비중</th><th>구분</th><th>상태</th><th>수익률</th><th>상세</th>';return `<div class="table-wrap"><table class="data-table" id="${id}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`}
function deferredTable(rows){if(!rows.length){document.getElementById('deferred-card').style.display='none';return ''}return `<div class="notice">요약이 준비되지 않은 글은 오늘 판단에서 제외하고 다음 실행에서 다시 확인합니다.</div><ul>${rows.map(r=>`<li>${esc(r.title||'제목 없음')} ${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">원문</a>`:''}</li>`).join('')}</ul>`}
const allocationActual=actualStockWeight!==null&&actualEtfWeight!==null&&actualCashWeight!==null;
document.getElementById('summary').innerHTML=`누적 수익률: ${esc("+1.71%")} · 최대 낙폭: ${esc("-2.34%")}<br>기준 포트폴리오 대비: ${esc("+3.32%p")} (수익률 차이)<br>자산배분(${allocationActual?'실제':'목표'}): 개별주 ${weight(allocationActual?actualStockWeight:stockWeight)} / 주식형 ETF ${weight(allocationActual?actualEtfWeight:etfWeight)} / 현금성 ${weight(allocationActual?actualCashWeight:cashWeight)}<br>오늘 승인된 비중 변경: ${changes.length?'있음':'없음'}${statusNote?`<br><strong>${esc(statusNote)}</strong>`:''}`;
document.getElementById('deferred').innerHTML=deferredTable(deferredPosts);
document.getElementById('insights').innerHTML=insights.length?insights.map((r,i)=>`<article><h3>${i+1}. ${esc(r.title)}</h3><p>${esc(r.summary)}</p><p><strong>추적할 조건:</strong> ${esc(r.investment_implication)}</p><p class="muted">${evidence(r)}</p></article>`).join(''):'<div class="empty">표시할 인사이트가 없습니다.</div>';
document.getElementById('portfolio').innerHTML=table('portfolio-table',portfolio,'portfolio');
document.getElementById('changes').innerHTML=changes.length?table('changes-table',changes,'changes'):(actionsDeferred&&driftRows.length?'<div class="empty">승인된 매매 없음 · 현재 비중 이탈이 확인됐지만 내부 검증이 끝나지 않아 자동 조정을 보류합니다.</div>':'<div class="empty">승인된 매매 없음 · 전 종목이 허용 범위 안에 있습니다.</div>');
document.getElementById('watchlist').innerHTML=table('watchlist-table',watchlist,'watchlist');
document.getElementById('closed').innerHTML=table('closed-table',closed,'closed');
const mainContent=document.querySelector('main.container');
const portfolioCard=document.getElementById('portfolio').closest('section');
const changesCard=document.getElementById('changes').closest('section');
const insightsCard=document.getElementById('insights').closest('section');
const watchlistCard=document.getElementById('watchlist').closest('section');
const closedCard=document.getElementById('closed').closest('section');
const reportCard=document.getElementById('report-content').closest('section');
const summaryCard=document.getElementById('summary').closest('section');
mainContent.insertBefore(portfolioCard, summaryCard.nextSibling);
mainContent.insertBefore(changesCard, portfolioCard.nextSibling);
mainContent.insertBefore(insightsCard, changesCard.nextSibling);
mainContent.insertBefore(watchlistCard, insightsCard.nextSibling);
for(const card of [closedCard,reportCard]){const content=card.querySelector('div');content.style.display='none';card.querySelector('h2').style.cursor='pointer';card.querySelector('h2').onclick=()=>{content.style.display=content.style.display==='none'?'block':'none'}}
const colors=['#ef4444','#3b82f6','#22c55e','#f97316','#a855f7','#06b6d4','#eab308','#ec4899','#14b8a6','#f59e0b','#6366f1','#84cc16','#64748b'];const chartable=chartRows.map(r=>({...r,weight:r.weight??r.target_weight}));
new Chart(document.getElementById('donut'),{type:'doughnut',data:{labels:chartable.map(r=>`${r.name} ${weight(r.weight)}`),datasets:[{data:chartable.map(r=>r.weight),backgroundColor:chartable.map((_,i)=>colors[i%colors.length])}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12}}}}});
if(summaries.length){new Chart(document.getElementById('returns'),{type:'line',data:{labels:summaries.map(r=>r.date),datasets:[{label:'모델 포트폴리오 수익률',data:summaries.map(r=>r.avg_return_krw),borderColor:'#60a5fa',tension:.25}]},options:{responsive:true,maintainAspectRatio:false}})}else{document.getElementById('returns').replaceWith(Object.assign(document.createElement('div'),{className:'empty',textContent:'성과 데이터가 아직 없습니다.'}))}
document.getElementById('report-content').innerHTML=reportText.trim()?marked.parse(reportText):'<div class="empty">보고서가 없습니다.</div>';
</script></body></html>
